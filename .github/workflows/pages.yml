name: pages

# Publishes the showcase site in web/ to GitHub Pages on every push to main that touches it.
# The site renders web/public/data, the bundle written by `terrakernel export-web` from a built
# repository; that bundle is committed so the build needs no research data and no model calls.
# To refresh it: terrakernel export-web <built repo> --out web/public/data, then commit.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        working-directory: web
        run: |
          npm ci
          test -f public/data/meta.json || { echo "public/data is missing: run terrakernel export-web first"; exit 1; }
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
