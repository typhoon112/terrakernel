[project]
name = "terrakernel"
version = "0.1.0"
description = "Compile multimodal research assets into an evidence-backed knowledge base and an AI-native research repository."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8,<3",
    "pydantic>=2.12,<3",
    "typer>=0.29",
    "rich>=14",
    "pyyaml>=6",
    "jinja2>=3.1",
    "markdown-it-py>=4",
    "mdit-py-plugins>=0.7",
    "pdfplumber>=0.11",
    "pypdfium2>=5",
    "pillow>=11",
    "pandas>=2.2",
    "numpy>=2",
    "rapidfuzz>=3",
    "mcp>=2.3,<3",
    "pygments>=2.18",
    "openpyxl>=3.1",
    "pyarrow>=17",
    "xarray>=2024.6",
    "netcdf4>=1.7",
]

[project.scripts]
terrakernel = "terrakernel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "reportlab>=4",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terrakernel"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM102", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
